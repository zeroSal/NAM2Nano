# XcodeGen spec — generate the Xcode project with:  ./Scripts/bootstrap.sh   (or: xcodegen generate)
name: NAM2Nano
options:
  bundleIdPrefix: com.nam2nano
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"

targets:
  NAM2Nano:
    type: application
    platform: macOS
    sources:
      - path: NAM2Nano
        excludes:
          - "Core/NAM/ThirdParty/**"
      # Only the C++ sources of NeuralAmpModelerCore (headers-only deps via HEADER_SEARCH_PATHS)
      - path: NAM2Nano/Core/NAM/ThirdParty/NeuralAmpModelerCore/NAM
        group: NAM2Nano/Core/NAM/ThirdParty
    settings:
      base:
        PRODUCT_NAME: NAM2Nano
        PRODUCT_BUNDLE_IDENTIFIER: com.nam2nano.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: NAM2Nano/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: NAM2Nano/Resources/NAM2Nano.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        SWIFT_OBJC_BRIDGING_HEADER: NAM2Nano/NAM2Nano-Bridging-Header.h
        SWIFT_STRICT_CONCURRENCY: minimal
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: libc++
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "NAM_SAMPLE_FLOAT=1"
          - "NAM_ENABLE_A2_FAST=1"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/NAM2Nano/Core/NAM/Engine"
          - "$(SRCROOT)/NAM2Nano/Core/NAM/ThirdParty/NeuralAmpModelerCore/NAM"
          - "$(SRCROOT)/NAM2Nano/Core/NAM/ThirdParty/NeuralAmpModelerCore/Dependencies/eigen"
          - "$(SRCROOT)/NAM2Nano/Core/NAM/ThirdParty/NeuralAmpModelerCore/Dependencies/nlohmann"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # NAM + Eigen must be optimised even in Debug, otherwise the real-time thread cannot keep up.
        GCC_OPTIMIZATION_LEVEL: 3
        WARNING_CFLAGS: ["-Wno-shorten-64-to-32", "-Wno-comma"]
